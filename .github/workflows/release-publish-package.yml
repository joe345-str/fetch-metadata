name: "Publish Immutable Action Version"

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
  
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v7
      
      - name: Publish
        id: publish
        uses: actions/publish-immutable-action@v0.0.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set summary
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          echo ":rocket: Successfully published a new version of the immutable action package pointing at release: $RELEASE_NAME" >> $GITHUB_STEP_SUMMARY
